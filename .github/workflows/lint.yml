name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: Prettier and Markdownlint
    runs-on: ubuntu-latest

    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Check formatting (Prettier)
        run: npx prettier@latest --check .

      - name: Check Markdown (markdownlint)
        run: npx markdownlint-cli@latest "**/*.md"
