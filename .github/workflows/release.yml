# Release
#
# A push to main opens or updates a Release Please pull request when fix:,
# feat:, or BREAKING CHANGE: commits are waiting. Merging that pull request
# signs, notarizes, and publishes CoreLocationCLI.zip. The tag is the version
# with no v prefix, because the Homebrew cask downloads
# releases/download/<version>/CoreLocationCLI.zip.
#
# skip-github-release is set so this workflow creates the tag and the GitHub
# release together, after stapling succeeds. A tag created with GITHUB_TOKEN
# does not start another workflow.
#
# The cask is on Homebrew's autobump list. BrewTestBot opens the cask pull
# request. This workflow does not run brew bump-cask-pr.
# https://docs.brew.sh/Autobump

name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propose:
    name: Open or update the release pull request
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.merged.outputs.pr }}
      tag_name: ${{ steps.merged.outputs.tag_name }}
    steps:
      - name: Open the release pull request
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Find a merged release pull request
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            .[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending"))
            | "\(.number) \(.title | capture("release (?<v>[0-9]+[.][0-9]+[.][0-9]+)").v)"' | head -n 1)
          if [ -n "$found" ]; then
            read -r pr tag <<< "$found"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and test
    needs: propose
    uses: ./.github/workflows/ci.yml

  publish:
    name: Notarize and publish the GitHub release
    needs: [propose, test]
    if: needs.test.result == 'success' && needs.propose.outputs.tag_name != ''
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out this commit
        uses: actions/checkout@v5

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64}" ] || [ -z "${P12_PASSWORD}" ]; then
            echo "Developer ID certificate secrets are not set" >&2
            exit 1
          fi
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain_path" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Write the notary key
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, and notarize
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: ./scripts/build.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.propose.outputs.tag_name }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$TAG" != "$version" ]; then
            echo "tag $TAG does not match VERSION $version" >&2
            exit 1
          fi
          gh release create "$TAG" CoreLocationCLI.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Mark the release pull request tagged
        if: needs.propose.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.propose.outputs.pr }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/autorelease:%20pending" || true
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=autorelease: tagged"
