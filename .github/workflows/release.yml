# Release
#
# A push to main opens or updates a Release Please pull request when fix:,
# feat:, or BREAKING CHANGE: commits are waiting. Merging that pull request
# signs, notarizes, and publishes CoreLocationCLI.zip. The tag is the version
# with no v prefix, because the Homebrew cask downloads
# releases/download/<version>/CoreLocationCLI.zip.
#
# skip-github-release is set so this workflow creates the tag and the GitHub
# release together, after stapling succeeds. A tag created with GITHUB_TOKEN
# does not start another workflow.
#
# The cask is on Homebrew's autobump list. BrewTestBot opens the cask pull
# request. This workflow does not run brew bump-cask-pr.
# https://docs.brew.sh/Autobump
#
# The published zip is attested the way rust-template release 1.1.0 attests
# its binary: actions/attest with no predicate (SLSA Provenance v1), then a
# second statement, urn:version, with {"version":"<version>"}. Both lines go
# in release.sigstore.jsonl. Both attestations run in this publish job because
# the notarized zip does not exist in the test job. rust-template attests
# provenance in its build job and passes the binary across as an artifact.
#
# Public repositories can use attest for free. Private repos require Enterprise Cloud.
#
# Check a published file:
#   gh attestation verify ./CoreLocationCLI.zip -R fulldecent/corelocationcli
#   gh attestation verify ./CoreLocationCLI.zip -R fulldecent/corelocationcli --bundle ./release.sigstore.jsonl
#   gh attestation verify ./CoreLocationCLI.zip -R fulldecent/corelocationcli --bundle ./release.sigstore.jsonl --predicate-type urn:version

name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propose:
    name: Open or update the release pull request
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.merged.outputs.pr }}
      tag_name: ${{ steps.merged.outputs.tag_name }}
    steps:
      - name: Open the release pull request
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Find a merged release pull request
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            .[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending"))
            | "\(.number) \(.title | capture("release (?<v>[0-9]+[.][0-9]+[.][0-9]+)").v)"' | head -n 1)
          if [ -n "$found" ]; then
            read -r pr tag <<< "$found"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and test
    needs: propose
    uses: ./.github/workflows/ci.yml

  publish:
    name: Notarize and publish the GitHub release
    needs: [propose, test]
    if: needs.test.result == 'success' && needs.propose.outputs.tag_name != ''
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v5

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64}" ] || [ -z "${P12_PASSWORD}" ]; then
            echo "Developer ID certificate secrets are not set" >&2
            exit 1
          fi
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain_path" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Write the notary key
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, and notarize
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: ./scripts/build.sh

      - name: Collect the zip
        run: |
          set -euo pipefail
          mkdir dist
          mv CoreLocationCLI.zip dist/

      - name: Attest the build
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Attest the version
        id: version
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          predicate-type: urn:version
          predicate: ${{ format('{{"version":"{0}"}}', needs.propose.outputs.tag_name) }}

      # dist/* was already attested. Write the sidecar after, so it is not a subject.
      - name: Write the sidecar
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION_BUNDLE: ${{ steps.version.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -c . "$PROVENANCE_BUNDLE" > dist/release.sigstore.jsonl
          jq -c . "$VERSION_BUNDLE" >> dist/release.sigstore.jsonl

      - name: Check the sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.propose.outputs.tag_name }}
        run: |
          set -euo pipefail
          version=$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' VERSION | head -1)
          if [ "$TAG" != "$version" ]; then
            echo "tag $TAG does not match VERSION $version" >&2
            exit 1
          fi
          for f in dist/*; do
            [ "$f" = dist/release.sigstore.jsonl ] && continue
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --bundle dist/release.sigstore.jsonl
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --bundle dist/release.sigstore.jsonl \
              --predicate-type urn:version
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.propose.outputs.tag_name }}
        run: |
          set -euo pipefail
          # One call, files included. A later upload fails once release immutability is on.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Mark the release pull request tagged
        if: needs.propose.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.propose.outputs.pr }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/autorelease:%20pending" || true
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=autorelease: tagged"
